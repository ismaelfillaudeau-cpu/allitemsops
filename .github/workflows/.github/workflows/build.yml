name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q allitemsop.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build --no-daemon
        working-directory: project/${{ matrix.loader }}
      - uses: actions/upload-artifact@v4
        with:
          name: allitemsop-${{ matrix.loader }}
          path: project/${{ matrix.loader }}/build/libs/*.jar
